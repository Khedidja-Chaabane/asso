<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/header.css">
  <link rel="stylesheet" href="../styles/footer.css">
  <style>
    /* Styles spécifiques à la page contact */
    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: 'Poppins', sans-serif;
    }

    h2#form-title {
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 600;
    }

    .contact-container {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    .map, .formulaire {
      flex: 1 1 400px;
      min-width: 300px;
    }

    iframe {
      width: 100%;
      height: 300px;
      border: 0;
      border-radius: 8px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background-color: #f9f9f9;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    label {
      font-weight: 500;
      margin-bottom: 0.3rem;
    }

    input, select, textarea {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
    }

    button[type="submit"] {
      background-color: #ff4d4d;
      color: #fff;
      border: none;
      padding: 0.7rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    button[type="submit"]:hover {
      background-color: #e03e3e;
    }

    @media (max-width: 768px) {
      .contact-container {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="../index.html"><img id="logo" src="../images/logo.png" alt="logo"></a>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../about.html">About</a>
      <a href="../danses.html">Danses</a>
      <a href="gallery.html">Galerie</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2 id="form-title">Contactez-nous</h2>
    <div class="contact-container">
      <!-- Carte -->
      <div class="map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2626.8446857924087!2d2.417506276303602!3d48.82302477132735!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e672facbcefb53%3A0xd6bed7d376d2c5da!2s60%20Av.%20du%20Mar%C3%A9chal%20de%20Lattre%20de%20Tassigny%2C%2094410%20Saint-Maurice!5e0!3m2!1sfr!2sfr!4v1755634161713!5m2!1sfr!2sfr" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

      <!-- Formulaire -->
      <div class="formulaire">
        <form>
          <div>
            <label for="name">Prénom:</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div>
            <label for="lastName">Nom:</label>
            <input type="text" id="lastName" name="lastName" required>
          </div>
          <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div>
            <label for="cours">Choisissez un cours:</label>
            <select id="cours" name="cours" required>
              <option value="">-- Sélectionnez un cours --</option>
              <option value="bollywood">Bollywood</option>
              <option value="bharatanatyam">Bharatanatyam</option>
              <option value="kathak">Kathak</option>
              <option value="bhangra">Bhangra</option>
              <option value="autre">Autre</option>
            </select>
          </div>
          <div>
            <label for="msg">Message:</label>
            <textarea id="msg" name="msg" rows="6"></textarea>
          </div>
          <button type="submit">Envoyer</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <div id="socialMedia">
      <a href="https://www.facebook.com/" target="_blank"><img src="../images/fb_360.png" alt="facebook"></a>
      <a href="https://www.instagram.com/" target="_blank"><img src="../images/insta_360.jpg" alt="instagram"></a>
      <a href="https://www.tiktok.com/" target="_blank"><img src="../images/tiktok_360.png" alt="tiktok"></a>
    </div>
    <div id="adresse">
      <img src="../images/local.jpg" alt="local">
      <p>60 Av. du Maréchal de Lattre de Tassigny</p>
    </div>
    <div id="copyRight">
      <p>&copy; Khedidja CHAABANE ~ 2025</p>
    </div>
  </footer>
</body>

</html>
