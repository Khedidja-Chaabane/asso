<main>
  <h2 id="form-title">Contact</h2>
  <div class="contact-container">
    
    <div class="map">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2626.8446857924087!2d2.417506276303602!3d48.82302477132735!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e672facbcefb53%3A0xd6bed7d376d2c5da!2s60%20Av.%20du%20Mar%C3%A9chal%20de%20Lattre%20de%20Tassigny%2C%2094410%20Saint-Maurice!5e0!3m2!1sfr!2sfr!4v1755634161713!5m2!1sfr!2sfr" 
        width="400" 
        height="300" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <div class="formulaire">
      <form>
        <div id="contact">
          <label for="name">Votre prénom: </label>
          <input type="text" name="name" id="name" required />
        </div>
        <div>
          <label for="lastName">Votre nom: </label>
          <input type="text" name="lastName" id="lastName" required />
        </div>
        <div>
          <label for="email">Votre email: </label>
          <input type="email" name="email" id="email" required />
        </div>
        <div>
    <label for="cours">Choisissez un cours :</label>
    <select name="cours" id="cours" required>
      <option value="">-- Sélectionnez un cours --</option>
      <option value="bollywood">Bollywood</option>
      <option value="bharatanatyam">Bharatanatyam</option>
      <option value="kathak">Kathak</option>
      <option value="bhangra">Bhangra</option>
      <option value="autre">Autre</option>
    </select>
  </div>
        <div>
          <label for="msg">Votre message: </label>
          <textarea name="msg" id="msg"rows="10"></textarea>
        </div>
        <div class="form-example">
          <button type="submit">Envoyer</button>
        </div>
      </form>
    </div>
  </div>
</main>
